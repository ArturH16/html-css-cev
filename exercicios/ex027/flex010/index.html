<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .conteiner {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row nowrap;
        }

        .item {
            flex-basis: 250px;
            flex-shrink: 1;
            text-align: center;
            flex-grow: 1;
            background-color: lightblue;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">
            A
        </div>
        <div class="item">
B
        </div>
        <div class="item">
C
        </div>
    </div>
     
</body>
</html>
