<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propriedades dos itens Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(4,1fr);
            background-color: aqua;
        }

        .item {
            text-align: center;
            border: 3px solid black;
        }
        

        .caixa1 {
            /*grid-row-start: 1;
            grid-row-end: 2;*/
            grid-row: 1/ 2;
            /*grid-column-start: 1;
            grid-column-end: 5;*/
            grid-column: 1 / span 4;

          }

          .caixa2 {
            /*grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;*/
            grid-area: 2 / 1 / 4 / 3;
          }

          .caixa3 {
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
          }

    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1 item" >Caixa01</div>
        <div class="caixa2 item"  >Caixa02</div>
        <div class="caixa3 item" >Caixa03</div>
    </div>
    
</body>
</html>
